version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: nova_postgres
    environment:
      POSTGRES_USER: nova_user
      POSTGRES_PASSWORD: SuperSecurePass123!
      POSTGRES_DB: nova_ai_db
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    container_name: nova_redis
    ports:
      - "6379:6379"
